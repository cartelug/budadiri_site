<article class="reg">
  <span class="reg__ref num">{{ref}}</span>

  <div class="reg__main">
    <h3 class="reg__subject">{{subject}}</h3>
    <p class="reg__action">{{action}}</p>
    <div class="tags">{{tags::tag}}</div>
  </div>

  <div class="reg__cell">
    <span class="reg__key">On the slope</span>
    <span class="reg__place">{{place}}</span>
    <span class="alt">{{band}}</span>
  </div>

  <div class="reg__cell">
    <span class="reg__key">Status</span>
    <span class="status status--{{status}}">{{stage}}</span>
  </div>

  <div class="reg__cell">
    <span class="reg__key">Recorded</span>
    <span class="reg__date">{{date}}</span>
  </div>

  <a class="source-link reg__source" href="{{href}}" target="_blank" rel="noopener">{{source}} <span class="arrow" aria-hidden="true"></span></a>
</article>
