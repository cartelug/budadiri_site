<div class="band field field--{{tone}}" style="--alt-lo:{{lo}}; --alt-hi:{{hi}}">
  <div class="wrap band__inner">
    <div class="band__alt">
      <span class="band__range">{{range}}</span>
      <span class="band__depth">{{depth}}</span>
    </div>

    <div class="band__body">
      <h3 class="band__name">{{name}}</h3>
      <p>{{body}}</p>
    </div>

    <dl class="band__work">
      <dt>{{label}}</dt>
      {{work::dd}}
    </dl>
  </div>
</div>
