# Publish the constituency site to GitHub Pages.
#
# The build is path-independent — every URL it emits is relative — so there
# is nothing here pointing at a particular domain or subfolder, and moving
# the site later needs no change to this file.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-uploaded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # This repository had Pages on the legacy "deploy from a branch"
      # source, which publishes the repo root verbatim — the unbuilt
      # source — and finishes after this workflow, overwriting it every
      # time. configure-pages' `enablement` only creates a site that does
      # not exist yet; it will not move an existing one off legacy. So ask
      # the API directly. The workflow token already has pages: write.
      - name: Take Pages off the legacy branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "Pages build_type is currently: $current"
          if [ "$current" != "workflow" ]; then
            if gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow; then
              echo "switched Pages to building from this workflow"
            else
              echo "::warning::Could not switch automatically. Set Settings -> Pages -> Source -> GitHub Actions, or the branch build will keep overwriting this deploy."
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - run: npm run build

      # One root-absolute URL is enough to break the site on a project
      # page, and it fails silently in a browser. Catch it here instead.
      - name: Check every URL is relative
        run: |
          bad=$(grep -rlE '(href|src)="/[^/]' dist --include='*.html' || true)
          bad="$bad $(grep -rl 'url(/' dist --include='*.css' || true)"
          if [ -n "$(echo "$bad" | tr -d '[:space:]')" ]; then
            echo "::error::absolute URLs found in: $bad"
            exit 1
          fi
          echo "all URLs are relative"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
