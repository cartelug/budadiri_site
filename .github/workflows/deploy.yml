# Publish the constituency site to GitHub Pages.
#
# The build is path-independent — every URL it emits is relative — so there
# is nothing here pointing at a particular domain or subfolder, and moving
# the site later needs no change to this file.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-uploaded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # enablement moves the repository off the legacy "deploy from a
      # branch" mode, which would publish the unbuilt source. Idempotent.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - run: npm run build

      # One root-absolute URL is enough to break the site on a project
      # page, and it fails silently in a browser. Catch it here instead.
      - name: Check every URL is relative
        run: |
          bad=$(grep -rlE '(href|src)="/[^/]' dist --include='*.html' || true)
          bad="$bad $(grep -rl 'url(/' dist --include='*.css' || true)"
          if [ -n "$(echo "$bad" | tr -d '[:space:]')" ]; then
            echo "::error::absolute URLs found in: $bad"
            exit 1
          fi
          echo "all URLs are relative"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
